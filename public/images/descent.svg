<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="The Descent — a scroll-driven dive">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c7d8"/>
      <stop offset="14%" stop-color="#3f92a6"/>
      <stop offset="32%" stop-color="#1c4b59"/>
      <stop offset="52%" stop-color="#0c2438"/>
      <stop offset="74%" stop-color="#030a14"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lure" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8f8ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#78dcff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#50beff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#water)"/>

  <!-- shafts of surface light -->
  <g>
    <polygon points="120,0 190,0 260,300 170,300" fill="url(#ray)"/>
    <polygon points="380,0 420,0 470,260 400,260" fill="url(#ray)"/>
    <polygon points="700,0 800,0 830,290 720,290" fill="url(#ray)"/>
    <polygon points="980,0 1020,0 1060,240 1000,240" fill="url(#ray)"/>
  </g>

  <!-- pier piles -->
  <g opacity="0.5">
    <rect x="52" y="0" width="46" height="330" fill="#0a2028"/>
    <rect x="1108" y="0" width="34" height="280" fill="#0a2028"/>
    <circle cx="66" cy="90" r="9" fill="#ec8296" opacity="0.65"/>
    <circle cx="88" cy="150" r="7" fill="#96dccd" opacity="0.6"/>
    <circle cx="62" cy="220" r="10" fill="#f7be78" opacity="0.55"/>
    <circle cx="1126" cy="120" r="8" fill="#ec8296" opacity="0.55"/>
  </g>

  <!-- diver silhouette, small, high in the column -->
  <g transform="translate(600 176)" opacity="0.9">
    <ellipse cx="0" cy="0" rx="30" ry="13" fill="#04161d"/>
    <circle cx="27" cy="-6" r="9" fill="#04161d"/>
    <rect x="-30" y="-12" width="20" height="18" rx="4" fill="#04161d"/>
    <path d="M-30 2 l -26 12 l 8 8 l 26 -12 Z" fill="#04161d"/>
    <path d="M10 8 q 16 12 30 8" stroke="#04161d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <g fill="#ffffff" opacity="0.5">
      <circle cx="34" cy="-22" r="3.5"/>
      <circle cx="44" cy="-38" r="2.6"/>
      <circle cx="38" cy="-54" r="4.2"/>
      <circle cx="50" cy="-72" r="2.2"/>
    </g>
  </g>

  <!-- anglerfish lure, far below -->
  <circle cx="905" cy="546" r="54" fill="url(#lure)"/>
  <circle cx="905" cy="546" r="6" fill="#e2fcff"/>
  <path d="M905 546 q 40 -26 78 -6 q 34 20 22 46 q -14 26 -60 22 q -44 -4 -40 -34" fill="#061219" opacity="0.9"/>

  <!-- marine snow -->
  <g fill="#ced8e0" opacity="0.35">
    <circle cx="220" cy="470" r="2"/><circle cx="330" cy="560" r="1.6"/><circle cx="470" cy="500" r="2.4"/>
    <circle cx="560" cy="610" r="1.8"/><circle cx="680" cy="520" r="1.4"/><circle cx="760" cy="600" r="2.2"/>
    <circle cx="150" cy="600" r="1.6"/><circle cx="1050" cy="500" r="2"/><circle cx="990" cy="640" r="1.5"/>
    <circle cx="400" cy="650" r="1.9"/><circle cx="620" cy="440" r="1.3"/><circle cx="860" cy="470" r="1.7"/>
  </g>

</svg>
